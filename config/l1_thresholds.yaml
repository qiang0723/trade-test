# L1 Advisory Layer - 阈值配置文件
# 所有阈值都是保守起点，需要通过回测优化

# ==================
# PR-010: Symbol Universe（币种宇宙）
# ==================
symbol_universe:
  # 支持的币种列表（合约市场）
  enabled_symbols:
    - BTC    # Bitcoin
    - ETH    # Ethereum
    - SOL    # Solana
    - TA     # TA
    - AT     # AT
    - HANA   # HANA
    - BTR    # BTR
    - GPS    # GPS
    - RIVER  # RIVER
    - BULLA  # BULLA
  
  # 默认币种（前端初始化）
  default_symbol: BTC

# ==================
# 币种级别策略配置（基于回测数据）
# ==================
symbol_strategy:
  # 高质量币种 - 可产生HIGH以上信号
  # 回测结果：BTR LONG 84.2%, GPS SHORT 63.1%
  high_quality_symbols:
    - BTR    # LONG信号84.2%胜率
    - GPS    # SHORT信号63.1%胜率
  
  # 币种方向偏好（基于回测胜率）
  # 只允许指定方向产生HIGH以上信号
  symbol_direction_bias:
    BTR: long      # BTR只允许LONG (84.2%胜率)
    GPS: short     # GPS只允许SHORT (63.1%胜率)
    # 其他币种：默认允许双向，但需要ULTRA置信度
  
  # 默认策略：非高质量币种需要ULTRA才能输出信号
  default_min_confidence: ultra
  
  # 高质量币种的最低置信度
  high_quality_min_confidence: high

# ==================
# 定时更新配置（整合自 monitored_symbols.yaml）
# ==================
periodic_update:
  enabled: true          # 是否启用定时更新
  interval_minutes: 1    # 更新间隔（分钟）
  market_type: futures   # 市场类型: futures 或 spot

# ==================
# 数据保留策略（整合自 monitored_symbols.yaml）
# ==================
data_retention:
  keep_hours: 24         # 保留最近24小时的数据
  cleanup_interval_hours: 6  # 每6小时清理一次

# ==================
# 错误处理（整合自 monitored_symbols.yaml）
# ==================
error_handling:
  max_retries: 3         # API调用失败时最大重试次数
  retry_delay_seconds: 5 # 重试延迟（秒）
  continue_on_error: true  # 单个symbol失败时继续处理其他symbol

# ==================
# 数据质量阈值
# ==================
data_quality:
  max_staleness_seconds: 120      # 数据最大过期时间（秒），超过视为过期

# ==================
# 决策频率控制（PR-C）- 平衡调整
# ==================
decision_control:
  # 最小决策间隔（秒）- 防止短时间内重复建议
  min_decision_interval_seconds: 300  # 5分钟
  
  # 翻转冷却时间（秒）- 防止LONG<->SHORT频繁切换
  flip_cooldown_seconds: 600  # 10分钟
  
  # 功能开关
  enable_min_interval: true
  enable_flip_cooldown: true

# ==================
# 市场环境识别阈值 - P2优化：降低TREND阈值便于捕捉趋势
# ==================
market_regime:
  extreme_price_change_1h: 0.07   # 1小时价格变化 > 7% → EXTREME（提高，减少EXTREME拒绝）
  trend_price_change_6h: 0.02     # 6小时价格变化 > 2% → TREND（优化前3%，降低33%）
  short_term_trend_1h: 0.015      # 1小时价格变化 > 1.5% → 短期TREND（优化前2%）

# ==================
# 风险准入阈值
# ==================
risk_exposure:
  # 清算阶段检测
  liquidation:
    price_change: 0.05            # 价格变化阈值（小数格式：0.05=5%）
    oi_drop: -0.15                # OI下降阈值（小数格式：-0.15=-15%）
  
  # 拥挤风险检测
  crowding:
    funding_abs: 0.001            # 费率绝对值阈值（小数格式：0.001=0.1%）
    oi_growth: 0.30               # 6h OI增长阈值（小数格式：0.30=30%）
  
  # 极端成交量检测
  extreme_volume:
    multiplier: 10.0              # 1h成交量超过24h均值的倍数

# ==================
# 交易质量阈值
# ==================
trade_quality:
  # 吸纳风险
  absorption:
    imbalance: 0.7                # 买卖失衡阈值
    volume_ratio: 0.5             # 成交量比例（相对于24h均值）
  
  # 噪音市场
  noise:
    funding_volatility: 0.0005    # 费率波动阈值（0.05%）
    funding_abs: 0.0001           # 当前费率阈值（0.01%）
  
  # 轮动风险
  rotation:
    price_threshold: 0.02         # 价格变化阈值（小数格式：0.02=2%）
    oi_threshold: 0.05            # OI变化阈值（小数格式：0.05=5%）
  
  # 震荡市弱信号（大幅放宽：只在极弱信号时才标记为弱）
  range_weak:
    imbalance: 0.05               # 失衡阈值（放宽：0.75→0.05，只有极弱失衡才标记）
    oi: 0.005                     # OI变化阈值（放宽：0.15→0.005，几乎不检查OI）

# ==================
# 方向评估阈值 - 回测优化v2：适度放宽边界条件
# 核心策略：只在TREND环境产生HIGH信号，边界条件适度放宽
# ==================
direction:
  # 趋势市（TREND环境100%胜率，适度放宽以捕获信号）
  trend:
    long:
      imbalance: 0.06             # 买卖失衡阈值（放宽：8%→6%）
      oi_change: 0.002            # 1h OI增长阈值
      price_change: 0.005         # 1h价格上涨阈值（放宽：0.6%→0.5%）
    short:
      imbalance: 0.10             # 买卖失衡阈值（放宽：15%→10%）
      oi_change: 0.005            # 1h OI增长阈值（放宽：0.8%→0.5%）
      price_change: 0.012         # 1h价格下跌阈值（放宽：1.5%→1.2%）
  
  # 震荡市（RANGE环境已被置信度系统过滤，这里设置宽松些）
  range:
    long:
      imbalance: 0.06             # 失衡要求（放宽：8%→6%）
      oi_change: 0.002            # OI增长要求
    short:
      imbalance: 0.10             # 失衡要求（放宽：15%→10%）
      oi_change: 0.005            # OI增长要求
    
    # 短期机会识别
    short_term_opportunity:
      long:
        min_price_change_1h: 0.005      # 1小时涨幅 > 0.5%（放宽）
        min_oi_change_1h: 0.002         # OI增长 > 0.2%
        min_taker_imbalance: 0.05       # 买压 > 5%（放宽）
        min_buy_sell_imbalance: 0.05    # DEPRECATED: 旧键名（兼容）
        required_signals: 1             # 3选1
      short:
        max_price_change_1h: -0.012     # 1小时跌幅 < -1.2%（放宽）
        min_oi_change_1h: 0.005         # OI增长 > 0.5%
        max_taker_imbalance: -0.08      # 卖压 < -8%（放宽：-12%→-8%）
        max_buy_sell_imbalance: -0.08   # DEPRECATED: 旧键名（兼容）
        required_signals: 2             # 3选2（保持严格）

# ==================
# 置信度配置 - 回测优化版：只保留确定性信号
# 回测结论：TREND环境100%胜率，RANGE环境18.4%胜率
# 策略：只在TREND环境产生HIGH以上信号
# ==================
confidence_scoring:
  # 基础分（信号频率优化：收紧RANGE环境）
  decision_score: 30               # 决策类型分（LONG/SHORT=30, NO_TRADE=0）
  regime_trend_score: 35           # TREND环境分（提高：30→35）
  regime_range_score: 5            # RANGE环境分（收紧：15→5，减少RANGE信号）
  regime_extreme_score: 0          # EXTREME环境分
  quality_good_score: 30           # GOOD质量分
  quality_uncertain_score: 10      # UNCERTAIN质量分（收紧：15→10）
  quality_poor_score: 0            # POOR质量分
  strong_signal_bonus: 10          # 强信号加分（收紧：15→10）
  
  # 档位映射（收紧MEDIUM门槛）
  thresholds:
    ultra: 85                      # >=85分 → ULTRA
    high: 75                       # >=75分 → HIGH
    medium: 55                     # >=55分 → MEDIUM（收紧：50→55）
  
  # 硬降级上限（caps）- MEDIUM确保只有TREND能到HIGH
  caps:
    # UNCERTAIN质量的上限（与min_confidence_reduced一致）
    uncertain_quality_max: "HIGH"    # HIGH（与min_confidence_reduced一致）
    
    # reduce_tags 的默认cap（必须 >= min_confidence_reduced）
    reduce_default_max: "HIGH"       # HIGH（与min_confidence_reduced一致）
    
    # 特定ReasonTag的上限（与min_confidence_reduced保持一致）
    tag_caps:
      noisy_market: "HIGH"           # HIGH（与min_confidence_reduced一致）
      weak_signal_in_range: "HIGH"   # HIGH（弱信号需HIGH才可执行）
      
      # P1-01 DataValidity: 异常值的caps
      data_outlier_price_change: "MEDIUM"      # 价格变化异常 → cap to MEDIUM
      data_outlier_oi_change: "MEDIUM"         # OI变化异常 → cap to MEDIUM
      data_outlier_taker_imbalance: "MEDIUM"   # taker失衡异常 → cap to MEDIUM
      data_outlier_funding_rate: "HIGH"        # 资金费率异常 → cap to HIGH（相对宽松）
      
      # P2-2 Funding三段式caps
      funding_elevated: "HIGH"                 # 中等风险 → cap to HIGH
      funding_crowding: "MEDIUM"               # 高拥挤 → cap to MEDIUM
      # funding_tailwind: 不设cap（逆风是增益）
      
      # P3-1 Dual Alignment caps
      timeframe_conflict: "MEDIUM"             # 周期冲突 → cap to MEDIUM
  
  # 强信号突破
  strong_signal_boost:
    enabled: true                  # 是否启用
    boost_levels: 1                # 提升档数
    
    # 触发突破的标签
    required_tags:
      - strong_buy_pressure
      - strong_sell_pressure

# ==================
# ReasonTag分类规则（PR-D）
# ==================
reason_tag_rules:
  # 降级标签（触发cap）
  reduce_tags:
    - noisy_market
    - weak_signal_in_range
    - extreme_volume  # PR-007: 单独时降级（联立时仍DENY）
  
  # 否决标签（强制LOW）
  deny_tags:
    - liquidation_phase
    - crowding_risk
    # extreme_volume已移至reduce_tags（PR-007）
    - data_stale
    - extreme_regime
    - absorption_risk
    - rotation_risk

# ==================
# 执行控制（方案D：双门槛机制）- 收紧版
# ==================
executable_control:
  # ALLOW 的最低置信度要求（正常执行）
  min_confidence_normal: "HIGH"     # HIGH 或 ULTRA
  
  # ALLOW_REDUCED 的最低置信度要求（降级执行）- 收紧
  min_confidence_reduced: "HIGH"    # 收紧：MEDIUM→HIGH（降级信号也需HIGH）
  
  # 说明：
  # - ALLOW: 无降级标签，要求 HIGH/ULTRA
  # - ALLOW_REDUCED: 有DEGRADE标签（如NOISY_MARKET），要求 MEDIUM及以上
  # - DENY: 有BLOCK标签（如EXTREME_VOLUME），永远不可执行
  #
  # 配合 caps 上限：
  # - noisy_market → cap to HIGH → ALLOW_REDUCED + MEDIUM门槛 → executable=True ✓

# ==================
# 辅助标签阈值
# ==================
auxiliary_tags:
  # OI 变化阈值（辅助信息标签）- P0-3修复：使用DECIMAL格式
  oi_growing_threshold: 0.05     # 1h OI 增长 > 5% → OI_GROWING（小数格式：0.05=5%）
  oi_declining_threshold: -0.05  # 1h OI 下降 < -5% → OI_DECLINING（小数格式：-0.05=-5%）
  
  # 资金费率阈值（辅助信息标签）
  funding_rate_threshold: 0.0005  # 费率绝对值 > 0.05% → HIGH/LOW_FUNDING_RATE

# ==================
# P2-2: Funding三段式规则
# ==================
funding_tiered:
  # 三段阈值（小数格式：0.001 = 0.1%）
  f_low: 0.0005     # 第一档阈值：0.05%（低于此不处理）
  f_high: 0.002     # 第二档阈值：0.2%（达到此为拥挤/逆风）
  
  # ELEVATED（中等风险）策略
  elevated:
    executability: "DEGRADE"      # 降级执行
    confidence_cap: "HIGH"        # 置信度上限
  
  # CROWDING（高拥挤）策略
  crowding:
    executability: "DEGRADE"      # 默认降级（可改为BLOCK）
    confidence_cap: "MEDIUM"      # 置信度上限
    block_enabled: false          # 是否强制阻断
  
  # TAILWIND（逆风）策略
  tailwind:
    executability: "ALLOW"        # 不降级
    quality_bonus: true           # 是否作为质量增益
    confidence_cap: "ULTRA"       # 置信度上限（不限制）

# ==================
# PR-005: 多周期三层触发（1h/15m/5m）
# ==================
multi_tf:
  # 功能开关
  enabled: true
  
  # Layer 1: Context（1小时方向偏置）- P2优化：适配低波动市场
  context_1h:
    # LONG方向Context
    long:
      min_price_change: 0.005     # 1h涨幅 > 0.5%（放宽：0.7%→0.5%）
      min_taker_imbalance: 0.15   # taker失衡 > 15%（放宽：30%→15%）
      min_oi_change: 0.02         # OI增长 > 2%（放宽：3.5%→2%）
      required_signals: 1         # 3选1（放宽：2→1，适应数据缺失）
    
    # SHORT方向Context
    short:
      max_price_change: -0.005    # 1h跌幅 < -0.5%（放宽：-0.7%→-0.5%）
      max_taker_imbalance: -0.15  # taker失衡 < -15%（放宽：-30%→-15%）
      min_oi_change: 0.02         # OI增长 > 2%（放宽：3.5%→2%）
      required_signals: 1         # 3选1（放宽：2→1，适应数据缺失）
  
  # Layer 2: Confirm（15分钟确认）- P2优化：适配低波动市场
  confirm_15m:
    # LONG方向Confirm
    long:
      min_price_change: 0.002     # 15m涨幅 > 0.2%（放宽：0.3%→0.2%）
      min_taker_imbalance: 0.15   # taker失衡 > 15%（放宽：40%→15%）
      min_volume_ratio: 1.0       # 放量比率 > 1.0x（放宽：1.2x→1.0x）
      min_oi_change: 0.005        # OI增长 > 0.5%（放宽：2%→0.5%）
      required_confirmed: 1       # 4选1确认（放宽：2→1）
      required_partial: 1         # 至少1个为部分
    
    # SHORT方向Confirm
    short:
      max_price_change: -0.002    # 15m跌幅 < -0.2%（放宽：-0.3%→-0.2%）
      max_taker_imbalance: -0.15  # taker失衡 < -15%（放宽：-40%→-15%）
      min_volume_ratio: 1.0       # 放量比率 > 1.0x（放宽：1.2x→1.0x）
      min_oi_change: 0.005        # OI增长 > 0.5%（放宽：2%→0.5%）
      required_confirmed: 1       # 4选1确认（放宽：2→1）
      required_partial: 1         # 至少1个为部分
  
  # Layer 3: Trigger（5分钟触发）- P2优化：适配低波动市场
  trigger_5m:
    # LONG方向Trigger
    long:
      min_price_change: 0.001     # 5m涨幅 > 0.1%（放宽：0.15%→0.1%）
      min_taker_imbalance: 0.15   # taker失衡 > 15%（放宽：50%→15%）
      min_volume_ratio: 1.0       # 放量比率 > 1.0x（放宽：1.5x→1.0x）
      required_signals: 1         # 3选1触发（放宽：2→1）
    
    # SHORT方向Trigger
    short:
      max_price_change: -0.001    # 5m跌幅 < -0.1%（放宽：-0.15%→-0.1%）
      max_taker_imbalance: -0.15  # taker失衡 < -15%（放宽：-50%→-15%）
      min_volume_ratio: 1.0       # 放量比率 > 1.0x（放宽：1.5x→1.0x）
      required_signals: 1         # 3选1触发（放宽：2→1）
  
  # 绑定策略
  binding_policy:
    # 短期机会是否要求CONFIRMED
    short_term_opportunity_requires_confirmed: true
    
    # PARTIAL的处理
    partial_action: "degrade"     # degrade/allow/deny
    
    # FAILED的处理
    failed_short_term_action: "cancel"    # 短期机会取消
    failed_long_term_action: "degrade"    # 长期信号降级保留

# ==================
# PR-DUAL: 双周期独立结论配置
# ==================
dual_timeframe:
  # 是否启用双周期输出
  enabled: true
  
  # 短期评估（5m/15m）阈值
  short_term:
    # 15分钟价格变化阈值（动态阈值，根据市场环境自动调整）
    # 平衡优化：适度提高阈值
    min_price_change_15m:
      dynamic: true                 # 启用动态阈值
      trend: 0.003                  # TREND环境: 0.3%
      range: 0.006                  # RANGE环境: 0.6%
      extreme: 0.012                # EXTREME环境: 1.2%
      default: 0.004                # 默认/降级: 0.4%
    
    # taker失衡阈值（买卖压力）
    min_taker_imbalance: 0.30      # 30%（中等水平）
    
    # 放量比率阈值
    min_volume_ratio: 1.3          # 1.3倍（中等水平）
    
    # OI变化阈值
    min_oi_change_15m: 0.02        # 2%（中等水平）
    
    # 满足信号数要求 - 5选3
    required_signals: 3            # 5维信号中至少3维满足
  
  # 中长期评估（1h/6h）复用 direction 配置
  # medium_term 使用现有的 direction.trend/range 配置
  
  # 冲突处理策略
  conflict_resolution:
    # 默认策略：no_trade / follow_medium_term / follow_short_term / follow_higher_confidence
    default_strategy: "no_trade"
    
    # 说明：
    # - no_trade: 冲突时保守不交易（默认，最安全）
    # - follow_medium_term: 跟随中长期趋势（适合趋势交易者）
    # - follow_short_term: 跟随短期信号（适合日内交易者）
    # - follow_higher_confidence: 跟随置信度更高的一方
  
  # 一致性加成
  alignment_bonus:
    # 双周期一致时，置信度提升
    confidence_boost: 1            # 提升1档（如 MEDIUM → HIGH）
    
    # 双周期一致时，是否放宽执行门槛
    relax_executable_threshold: false

# ==================
# 双周期决策频率控制（PR-DUAL）
# ==================
dual_decision_control:
  # 短期决策控制（5m/15m）
  short_term_interval_seconds: 300        # 最小决策间隔：5分钟
  short_term_flip_cooldown_seconds: 450   # 方向翻转冷却：7.5分钟（LONG ↔ SHORT）
  
  # 中长期决策控制（1h/6h）
  medium_term_interval_seconds: 1800      # 最小决策间隔：30分钟
  medium_term_flip_cooldown_seconds: 900  # 方向翻转冷却：15分钟（LONG ↔ SHORT）
  
  # 对齐类型翻转冷却
  alignment_flip_cooldown_seconds: 900    # 重大翻转冷却：15分钟（BOTH_LONG ↔ BOTH_SHORT）
  
  # 说明：
  # - NO_TRADE决策不受频率控制（允许随时输出）
  # - 翻转冷却时间应 >= 决策间隔时间
  # - 对齐类型仅阻断重大翻转（双向一致态互换）

# ==================
# 信号增强配置（Phase 1/2）
# ==================
signal_enhancement:
  # Phase 1.1: 资金费率极端反转阈值
  funding_extreme_positive: 0.001     # 正极端费率 > 0.1%
  funding_extreme_negative: -0.001    # 负极端费率 < -0.1%
  funding_very_extreme: 0.002         # 非常极端费率 > 0.2%（触发反转信号）
  
  # Phase 1.2: OI与价格背离阈值
  divergence_price_threshold: 0.01    # 价格变化阈值 1%
  divergence_oi_threshold: 0.02       # OI变化阈值 2%
  healthy_trend_oi_threshold: 0.01    # 健康趋势OI阈值 1%
  
  # Phase 1.3: 多周期一致性阈值
  alignment_imbalance_threshold: 0.05 # 方向判定阈值 5%
  
  # Phase 2: 大户多空比阈值
  top_trader_bias_threshold: 0.55     # 偏向阈值 55%（>55%认为有明确偏向）
  top_trader_extreme_threshold: 0.70  # 极端阈值 70%（>70%可能预示反转）
  
  # 置信度加分配置（收紧：减少加分上限）
  boost_limits:
    max_single_boost: 10              # 单项增强最大加分（收紧：15→10）
    max_total_boost: 15               # 总增强最大加分（收紧：30→15）
    min_total_boost: -15              # 总增强最小扣分（收紧：-20→-15）
