version: '3.8'

services:
  l1-advisory:
    build:
      context: .
      dockerfile: Dockerfile.l1
    image: trade-info-l1:latest
    container_name: l1-advisory-layer
    ports:
      - "8001:5001"
    volumes:
      # 挂载数据库目录，实现持久化存储
      - ./data/db:/app/data/db
      # 挂载配置文件，支持热更新
      - ./config:/app/config
      # 挂载日志目录（可选）
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - FLASK_DEBUG=false  # 关闭debug模式，防止热重载清空缓存
      # Coinglass API配置（从.env文件或环境变量读取）
      - COINGLASS_API_KEY=${COINGLASS_API_KEY:-}
      - COINGLASS_ENABLED=${COINGLASS_ENABLED:-true}
      - COINGLASS_BASE_URL=${COINGLASS_BASE_URL:-https://open-api-v4.coinglass.com}
    # 注意：.env文件需要在项目根目录创建（参考.env.example）
    # 如果.env不存在，环境变量将使用默认值或从系统环境读取
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # 单个日志文件最大10MB
        max-file: "3"        # 最多保留3个日志文件
    networks:
      - l1-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  l1-network:
    driver: bridge
